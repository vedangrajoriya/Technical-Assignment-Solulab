<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Precision Hexagon / Gear Base -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           fill="#0f172a" stroke="url(#forgeGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Synchronized Gear Teeth Pointers -->
  <path d="M50 2 L54 10 L46 10 Z" fill="#06b6d4"/>
  <path d="M50 98 L54 90 L46 90 Z" fill="#7c3aed"/>
  <path d="M6 31 L14 34 L10 27 Z" fill="#2563eb"/>
  <path d="M94 31 L86 34 L90 27 Z" fill="#06b6d4"/>
  <path d="M6 69 L14 66 L10 73 Z" fill="#2563eb"/>
  <path d="M94 69 L86 66 L90 73 Z" fill="#7c3aed"/>

  <!-- Dynamic Industrial Forge Flame / Flow Vectors (Interlocking F's) -->
  <path d="M36 28 H68 C72 28 75 31 75 35 C75 39 72 42 68 42 H48 V50 H62 C65 50 67 52 67 55 C67 58 65 60 62 60 H48 V72 C48 75 45 77 42 77 C39 77 36 75 36 72 Z" 
        fill="url(#forgeGrad)" filter="url(#glow)"/>

  <!-- Core Flow Diamond Accent -->
  <polygon points="58,45 68,55 58,65 48,55" fill="url(#innerGlow)" opacity="0.9"/>
  <circle cx="58" cy="55" r="3" fill="#ffffff"/>
</svg>
